# DigitalOcean App Platform spec for a Health Depot DEMO (synthetic data only).
# Use: App Platform -> your app -> Settings -> App Spec -> Edit -> paste this, replace every
# CHANGE-ME, then Save. Or: doctl apps create --spec .do/app.yaml
# Full guide: DEPLOYMENT_DIGITALOCEAN.md
name: health-depot
region: nyc

# Shared settings for web, worker and the migrate job.
envs:
  - key: DJANGO_SECRET_KEY
    type: SECRET
    value: CHANGE-ME-long-random-string-at-least-50-characters
  - key: DATABASE_URL
    value: ${db.DATABASE_URL}
  - key: DEBUG
    value: "false"
  - key: ALLOWED_HOSTS
    value: ${APP_DOMAIN}
  - key: CSRF_TRUSTED_ORIGINS
    value: ${APP_URL}
  - key: PUBLIC_BASE_URL
    value: ${APP_URL}
  - key: SECURE_SSL_REDIRECT
    value: "true"
  - key: FORWARDED_ALLOW_IPS
    value: "*"
  - key: DEMO_MODE
    value: "true"
  - key: DEMO_BANNER
    value: "true"
  - key: LOG_FORMAT
    value: json
  # File storage: a DigitalOcean Space (S3-compatible). Create the Space first.
  - key: AWS_STORAGE_BUCKET_NAME
    value: CHANGE-ME-space-name
  - key: AWS_S3_ENDPOINT_URL
    value: https://nyc3.digitaloceanspaces.com
  - key: AWS_S3_REGION_NAME
    value: nyc3
  - key: AWS_S3_ADDRESSING_STYLE
    value: virtual
  - key: AWS_ACCESS_KEY_ID
    type: SECRET
    value: CHANGE-ME-spaces-access-key
  - key: AWS_SECRET_ACCESS_KEY
    type: SECRET
    value: CHANGE-ME-spaces-secret-key
  - key: CSP_STORAGE_ORIGIN
    value: https://CHANGE-ME-space-name.nyc3.digitaloceanspaces.com
  - key: S3_CREATE_BUCKET
    value: "false"
  # No SMTP server yet: notification emails are written to the log instead of sent.
  - key: EMAIL_BACKEND
    value: django.core.mail.backends.console.EmailBackend

services:
  - name: web
    github:
      repo: CHANGE-ME-owner/CHANGE-ME-repo
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    run_command: entrypoint.sh web
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-1gb   # 1 GB: 512 MB is too small for Django + 2 workers
    instance_count: 1
    envs:
      - key: PORT
        value: "8000"
      - key: GUNICORN_WORKERS
        value: "2"
    health_check:
      http_path: /health/live
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 6

workers:
  - name: worker
    github:
      repo: CHANGE-ME-owner/CHANGE-ME-repo
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    run_command: entrypoint.sh worker
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

jobs:
  # Runs before every deploy: database migrations, demo data (first time only), storage check.
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: CHANGE-ME-owner/CHANGE-ME-repo
      branch: main
    dockerfile_path: Dockerfile
    run_command: entrypoint.sh migrate
    instance_size_slug: apps-s-1vcpu-1gb

databases:
  - name: db
    engine: PG
    version: "16"
    production: false   # dev database; use a managed cluster for anything beyond a demo
