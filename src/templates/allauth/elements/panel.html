{% load allauth %}
<section class="rounded-lg border border-slate-200 p-4">
  <h2 class="text-base font-semibold text-brand-900">{% slot title %}{% endslot %}</h2>
  <div class="mt-2 space-y-3 text-sm text-slate-600">{% slot body %}{% endslot %}</div>
  {% if slots.actions %}<div class="mt-4 flex flex-wrap gap-2">{% for action in slots.actions %}{{ action }}{% endfor %}</div>{% endif %}
</section>
