{% if messages %}
<div class="space-y-2" role="status">
  {% for message in messages %}
  <div class="rounded-md border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-900{% else %}border-emerald-200 bg-emerald-50 text-emerald-900{% endif %}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
