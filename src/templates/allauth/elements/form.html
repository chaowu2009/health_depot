{% load allauth %}
<form method="{{ attrs.method }}" {% if attrs.action %}action="{{ attrs.action }}"{% endif %} {% if attrs.id %}id="{{ attrs.id }}"{% endif %} class="space-y-4">
  {% if attrs.form.non_field_errors %}
  <div class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800" role="alert">{{ attrs.form.non_field_errors|join:" " }}</div>
  {% endif %}
  {% slot body %}{% endslot %}
  <div class="flex flex-wrap items-center gap-3 pt-1">{% slot actions %}{% endslot %}</div>
</form>
