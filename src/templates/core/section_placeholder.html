{% extends "app_shell.html" %}
{% block title %}{{ item.label }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-4xl">
  <div class="flex items-center gap-3">
    <h1 class="text-2xl font-semibold tracking-tight text-brand-900">{{ item.label }}</h1>
    {% if is_phase2 %}<span class="rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-semibold text-amber-900">Phase 2 — Preview</span>{% endif %}
  </div>
  <p class="mt-2 text-slate-600">{{ item.description }}</p>
  <div class="mt-8 rounded-xl border border-dashed border-slate-300 bg-white p-10 text-center">
    <p class="text-sm font-medium text-slate-700">This page is under construction.</p>
    <p class="mt-1 text-sm text-slate-500">Planned in build step: {{ item.coming_in }}</p>
  </div>
</div>
{% endblock %}
