{% extends "app_shell.html" %}
{% block title %}Open a case{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
  <a href="{% url 'case-list' %}" class="text-sm text-brand-600 hover:underline">← Cases</a>
  <h1 class="mt-2 text-2xl font-semibold tracking-tight text-brand-900">Open a case</h1>
  <form method="post" class="mt-6 space-y-4 rounded-xl border border-slate-200 bg-white p-6" novalidate>{% csrf_token %}
    {% for field in form %}{% include "partials/field.html" with field=field %}{% endfor %}
    <button class="rounded-md bg-brand-600 px-5 py-2 text-sm font-semibold text-white hover:bg-brand-700">Open case</button>
  </form>
</div>
{% endblock %}
